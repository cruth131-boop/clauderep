<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birthday Run">
<meta name="theme-color" content="#1b1035">
<meta name="robots" content="noindex, nofollow">
<title>Birthday Run</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
    <div id="hearts"></div>
  </div>
  <div id="progress" class="hidden"><div id="progress-bar"></div><span id="progress-cake">🎂</span></div>
  <div class="hud-right">
    <div id="score">0</div>
    <div id="best">HI 0</div>
  </div>
</div>
<button id="btn-duck" class="hidden" aria-label="Ducken">⬇</button>

<!-- Passwort -->
<section id="scr-lock" class="screen hidden">
  <div class="panel">
    <div class="big-emoji">🔒🎁</div>
    <h1>Psst… geheim!</h1>
    <p>Wie lautet das Passwort?</p>
    <form id="lock-form" autocomplete="off">
      <input id="lock-input" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort">
      <button class="btn primary" type="submit">Los geht's</button>
    </form>
    <p id="lock-error" class="error hidden">Nope. Das hab ich mir so nicht vorgestellt! 🙃</p>
  </div>
</section>

<!-- Menü -->
<section id="scr-menu" class="screen hidden">
  <div class="menu-wrap">
    <h1 id="menu-title" class="title">Birthday Run</h1>
    <p id="menu-sub" class="subtitle"></p>
    <div class="menu-buttons">
      <button class="btn primary big" data-mode="birthday">🎂 Geburtstags-Modus</button>
      <button class="btn big" data-mode="endless">♾️ Endlos-Modus</button>
      <button class="btn big horror" data-mode="horror" id="btn-horror">👻 Horror-Modus</button>
      <button class="btn big roadtrip" data-mode="roadtrip" id="btn-roadtrip">🚗 Roadtrip</button>
      <button class="btn big gift hidden" id="btn-gift">🎁 Mein Geschenk</button>
      <div class="row">
        <button class="btn" id="btn-wardrobe">👗 Kleiderschrank</button>
        <button class="btn" id="btn-ach">🏆 Erfolge</button>
        <button class="btn" id="btn-album">📸 Album</button>
        <button class="btn" id="btn-shake" title="Schüttel mich!">📳</button>
        <button class="btn" id="btn-mute">🔊</button>
      </div>
    </div>
    <p id="menu-hint" class="hint"></p>
  </div>
</section>

<!-- Kleiderschrank -->
<section id="scr-wardrobe" class="screen hidden">
  <div class="panel wardrobe">
    <div class="wardrobe-head">
      <h2>Kleiderschrank</h2>
      <button class="btn" id="btn-wardrobe-done">Fertig ✓</button>
    </div>
    <canvas id="preview" width="300" height="300"></canvas>
    <div class="presets">
      <button class="chip" data-preset="matrose">⚓ Klassiker</button>
      <button class="chip" data-preset="casual">👖 Casual</button>
      <button class="chip" data-preset="princess">👑 Birthday Princess</button>
    </div>
    <div id="wardrobe-cats"></div>
    <p id="wardrobe-msg" class="hint"></p>
  </div>
</section>

<!-- Erfolge -->
<section id="scr-ach" class="screen hidden">
  <div class="panel ach">
    <div class="wardrobe-head">
      <h2>🏆 Erfolge <small id="ach-count"></small></h2>
      <button class="btn" id="btn-ach-done">Fertig ✓</button>
    </div>
    <div id="ach-list"></div>
  </div>
</section>

<!-- Album -->
<section id="scr-album" class="screen hidden">
  <div class="panel album">
    <div class="wardrobe-head">
      <h2>📸 Album <small id="album-count"></small></h2>
      <button class="btn" id="btn-album-done">Fertig ✓</button>
    </div>
    <h3 class="album-h">Erinnerungen</h3>
    <div id="album-mem" class="album-grid"></div>
    <h3 class="album-h">Schnappschüsse <small>(lange drücken zum Speichern)</small></h3>
    <div id="album-snaps" class="album-grid"></div>
  </div>
  <div id="album-big" class="album-big hidden"><figure><img id="album-big-img" alt=""><figcaption id="album-big-cap"></figcaption></figure></div>
</section>

<!-- Pause -->
<section id="scr-pause" class="screen hidden">
  <div class="panel">
    <h2>Pause</h2>
    <button class="btn primary" id="btn-resume">Weiter</button>
    <button class="btn" id="btn-quit">Zum Menü</button>
  </div>
</section>

<!-- Game over -->
<section id="scr-over" class="screen hidden">
  <div class="panel over">
    <h2 id="over-title">Autsch!</h2>
    <p id="over-line" class="quote"></p>
    <div class="over-score"><span id="over-score">0</span><small id="over-best"></small></div>
    <p id="over-mercy" class="mercy hidden"></p>
    <button class="btn primary big" id="btn-again">Nochmal!</button>
    <button class="btn" id="btn-over-menu">Menü</button>
  </div>
</section>

<!-- Geschenk-Enthüllung -->
<section id="scr-reveal" class="screen hidden">
  <div class="reveal">
    <div class="reveal-kicker hidden" id="reveal-kicker"></div>
    <h1 id="reveal-title" class="title"></h1>
    <div id="reveal-date" class="reveal-date"></div>
    <p id="reveal-motto" class="motto"></p>
    <div id="reveal-motifs" class="motifs"></div>
    <canvas id="map" width="600" height="260"></canvas>
    <p id="reveal-text"></p>
    <div id="reveal-days" class="days"></div>
    <p id="reveal-unlock" class="hint"></p>
    <div class="row">
      <button class="btn" id="btn-replay-finale">🎆 Nochmal</button>
      <button class="btn primary" id="btn-reveal-menu">Menü</button>
    </div>
  </div>
</section>

<!-- In-Game Hinweis (Toast) -->
<div id="toast" class="hidden"></div>
<div id="tap-hint" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
